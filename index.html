<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cárdenas Atayauri Tatiana Rubi — Mini-ERP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FF9150%22/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* ===== Identidad de marca: degradado amarillo → naranja del logo ===== */
:root{--y:#FFDC55;--o:#FF9150;--grad:linear-gradient(90deg,#FFDC55,#FF9150);--bg:#fffaf2;--card:#fff;--tx:#3a2b1c;--mu:#7d6b58;--bd:#f0e2cc;--ok:#2e9e5b;--wa:#e0a100;--er:#d9453b;--inp:#fffdf8;--th:#f6efe4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--th:#382d20;--bg:#1d1812;--card:#2a231a;--tx:#f5eadb;--mu:#b9a68e;--bd:#44382a;--inp:#221c14}}
:root[data-theme="dark"]{--th:#382d20;--bg:#1d1812;--card:#2a231a;--tx:#f5eadb;--mu:#b9a68e;--bd:#44382a;--inp:#221c14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
h2{margin:0 0 14px}h3{margin:0 0 10px}
.hidden{display:none!important}
button,.btn{background:var(--o);color:#3a2b1c;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
button.sec{background:transparent;border:1.5px solid var(--o);color:var(--tx)}button.dng{background:var(--er);color:#fff}button.sm{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1.5px solid var(--bd);border-radius:9px;background:var(--inp);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--o);border-color:var(--o)}
label{font-size:12px;font-weight:700;color:var(--mu);display:block;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:18px}
.ic{width:16px;height:16px;vertical-align:-3px;margin-right:8px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}button .ic:only-child{margin:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:var(--th);color:var(--tx);text-align:left;padding:10px 8px;white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--o)}td{padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tal{border:1px solid var(--bd)}.tal th,.tal td{text-align:center;padding:2px;border:1px solid var(--bd)}.tal th{padding:8px 4px}.tal input{padding:8px 2px;text-align:center;min-width:44px;border:0;border-radius:0;background:transparent}.tal input:focus{outline:2px solid var(--o);outline-offset:-2px}.tal input.col{min-width:100px;text-align:left;padding-left:8px}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.g{background:var(--ok)}.a{background:var(--wa)}.r{background:var(--er)}.n{background:#8a8a8a}
/* Login */
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
#login .card{width:100%;max-width:380px;text-align:center}#login img{width:230px;max-width:90%;margin-bottom:10px}
#login .card>div{text-align:left;margin-bottom:12px}
/* App */
#app{flex:1;display:flex;min-height:0}
aside{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:6px}
aside img{width:100%;margin-bottom:8px}
aside .nav{background:transparent;text-align:left;color:var(--tx);font-weight:600;width:100%}
aside .nav.on{background:var(--th);box-shadow:inset 3px 0 0 var(--o)}
main{flex:1;padding:20px;min-width:0}
header.top{display:none}
footer{text-align:center;font-size:12px;color:var(--mu);padding:12px;border-top:1px solid var(--bd)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a2b1c;color:#fff;padding:10px 18px;border-radius:10px;z-index:99}
/* Cotización A4 */
#qpdf{background:#fff;color:#222;width:190mm;padding:12mm;margin:auto;font-size:12px;box-shadow:0 0 6px rgba(0,0,0,.2)}
#qpdf table th{background:#FF9150;color:#fff}#qpdf td{border-bottom:1px solid #ddd}
@media(max-width:760px){
#app{flex-direction:column}aside{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
aside img{width:110px;margin:0}aside .nav{width:auto;padding:6px 10px;font-size:12px}main{padding:12px}
#qpdf{transform-origin:top left}}
</style>
</head>

<script>
/* ================= Utilidades y almacenamiento ================= */
const $=s=>document.querySelector(s);
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('No se pudo guardar')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'S/ '+(+n||0).toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
/* Hash SHA-256 (con respaldo simple si el navegador no ofrece crypto.subtle) */
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tc::'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return 'b64:'+btoa(unescape(encodeURIComponent(s)))}}

async function boot(){
  if(!users().length){ // 2 administradores predeterminados
    S('tc_users',[{u:'admin1',p:await hash('admin123'),rol:'Administrador',fijo:1},{u:'admin2',p:await hash('admin456'),rol:'Administrador',fijo:1}]);
  }
  const s=sessionStorage.getItem('tc_ses');
  if(s){me=users().find(x=>x.u===s)||null}
  me?enter():0;
}
async function login(){
  const u=$('#lu').value.trim(),p=await hash($('#lp').value);
  const f=users().find(x=>x.u===u&&x.p===p);
  if(!f){$('#lerr').textContent='Usuario o contraseña incorrectos';return}
  me=f;sessionStorage.setItem('tc_ses',u);$('#lp').value='';$('#lerr').textContent='';enter();
}
function logout(){sessionStorage.removeItem('tc_ses');me=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
const isAdmin=()=>me&&me.rol==='Administrador';

function go(v){
  // Guard en tiempo real: operadores no pueden abrir vistas de administrador
  if(!VIEWS[v]||(VIEWS[v][1]&&!isAdmin())){toast('Acceso denegado: redirigido a tu panel');v='pedidos'}
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.id==='n_'+v));
  $('#view').innerHTML='';({pedidos:vPedidos,seguim:vSeg,cotiz:vCotiz,incid:vIncid,users:vUsers,ajustes:vAjustes})[v]();
}

/* ================= PEDIDOS ================= */
function semaforo(o){
  if(o.estado==='Entregado')return['n','Entregado'];
  const d=Math.ceil((new Date(o.entrega+'T23:59:59')-new Date())/864e5);
  if(d<0)return['r',`Retrasado ${-d}d`];
  if(d<=2)return['a',d===0?'Vence hoy':`Vence en ${d}d`];
  return['g',`A tiempo (${d}d)`];
}
function vPedidos(){
  const A=isAdmin();
  $('#view').innerHTML=`<h2>Nuevo pedido</h2>
  <div class="card"><h3>${ic('plus')}Datos del pedido</h3>
   <div class="grid">
    <div><label>Cliente</label><input id="pc"></div><div><label>RUC / DNI</label><input id="pd" inputmode="numeric" maxlength="11"></div>
    <div><label>Tipo de prenda</label><input id="pt" placeholder="Ej. Uniforme escolar"></div>
    <div><label>Fecha de registro</label><input id="pr" type="date" value="${today()}"></div>
    <div><label>Entrega estimada</label><input id="pe" type="date"></div>
   </div>
   <h3 style="margin-top:16px">Matriz de tallas por color</h3>
   <div class="scroll"><table class="tal"><thead><tr><th rowspan="2">Color</th><th colspan="6">Tallas numéricas</th><th colspan="5">Tallas por letras</th><th rowspan="2">Total</th><th rowspan="2"></th></tr><tr>${TALLAS.map(t=>`<th>${t}</th>`).join('')}</tr>
    </thead><tbody id="tb"></tbody></table></div>
   <button class="sec sm" style="margin-top:8px" onclick="addColor()">+ Agregar color</button>
   ${A?`<div class="grid" style="margin-top:14px">
    <div><label>Costo de producción unitario (S/)</label><input id="fc" type="number" min="0" step="0.01" oninput="calc()"></div>
    <div><label>Precio de venta unitario (S/)</label><input id="fp" type="number" min="0" step="0.01" oninput="calc()"></div>
    <div><label>Total venta</label><input id="ft" readonly></div><div><label>Margen estimado</label><input id="fm" readonly></div></div>`:''}
   <div style="margin-top:14px"><button onclick="savePedido()">Guardar pedido</button></div>
  </div>
  `;
  addColor();
}
/* Seguimiento: apartado independiente */
function vSeg(){
  const A=isAdmin();
  $('#view').innerHTML=`<h2>Seguimiento de pedidos</h2><div class="card"><div class="scroll"><table><thead><tr><th>N°</th><th>Cliente</th><th>Prenda</th><th>Piezas</th><th>Entrega</th><th>Alerta</th><th>Estado</th>${A?'<th>Total</th><th>Margen</th><th></th>':''}</tr></thead><tbody id="ot"></tbody></table></div></div>`;
  renderOrders();
}
function addColor(){
  const r=document.createElement('tr');
  r.innerHTML=`<td><input class="col" placeholder="Color"></td>${TALLAS.map(t=>`<td><input type="number" min="0" data-t="${t}" oninput="calc()"></td>`).join('')}<td class="rt"><b>0</b></td><td><button class="dng sm" onclick="this.closest('tr').remove();calc()">${ic('x')}</button></td>`;
  $('#tb').appendChild(r);
}
function pzas(){let n=0;document.querySelectorAll('#tb input[data-t]').forEach(i=>n+=+i.value||0);return n}
function calc(){
  document.querySelectorAll('#tb tr').forEach(r=>{let s=0;r.querySelectorAll('input[data-t]').forEach(i=>s+=+i.value||0);r.querySelector('.rt b').textContent=s});
  if(!isAdmin())return;
  const n=pzas(),c=+$('#fc').value||0,p=+$('#fp').value||0;
  $('#ft').value=money(n*p);$('#fm').value=money(n*(p-c))+(p?` (${((p-c)/p*100).toFixed(0)}%)`:'');
}
function savePedido(){
  const cli=$('#pc').value.trim(),ent=$('#pe').value;
  if(!cli||!ent||!$('#pt').value.trim())return toast('Completa cliente, prenda y fecha de entrega');
  if(ent<$('#pr').value)return toast('La entrega no puede ser anterior al registro');
  const tallas=[...document.querySelectorAll('#tb tr')].map(r=>{const q={};r.querySelectorAll('input[data-t]').forEach(i=>{if(+i.value>0)q[i.dataset.t]=+i.value});return{color:r.querySelector('.col').value.trim()||'Sin color',q}}).filter(x=>Object.keys(x.q).length);
  if(!tallas.length)return toast('Ingresa al menos una cantidad');
  const os=orders(),id='P'+String(os.length+1).padStart(4,'0'),n=pzas();
  os.push({id,cliente:cli,doc:$('#pd').value.trim(),prenda:$('#pt').value.trim(),registro:$('#pr').value,entrega:ent,estado:'Registrado',tallas,piezas:n,por:me.u});
  S('tc_orders',os);
  if(isAdmin()){const f=fin();f[id]={costo:+$('#fc').value||0,precio:+$('#fp').value||0};S('tc_fin',f)} // finanzas en clave separada
  toast('Pedido '+id+' guardado');vPedidos();
}
function renderOrders(){
  const A=isAdmin(),f=A?fin():{},os=orders().slice().reverse();
  $('#ot').innerHTML=os.length?os.map(o=>{const[s,t]=semaforo(o),x=f[o.id]||{costo:0,precio:0};
   const det=o.tallas.map(z=>z.color+': '+Object.entries(z.q).map(([k,v])=>k+'×'+v).join(' ')).join(' | ');
   return`<tr><td>${o.id}</td><td title="${esc(o.doc)}">${esc(o.cliente)}</td><td title="${esc(det)}">${esc(o.prenda)}</td><td>${o.piezas}</td><td>${o.entrega}</td><td><span class="pill ${s}">${t}</span></td>
   <td><select onchange="setEstado('${o.id}',this.value)">${ESTADOS.map(e=>`<option ${e===o.estado?'selected':''}>${e}</option>`).join('')}</select></td>
   ${A?`<td>${money(o.piezas*x.precio)}</td><td>${money(o.piezas*(x.precio-x.costo))}</td><td><button class="dng sm" onclick="delPedido('${o.id}')">Eliminar</button></td>`:''}</tr>`}).join(''):`<tr><td colspan="10">Sin pedidos registrados.</td></tr>`;
}
function setEstado(id,e){const os=orders();os.find(o=>o.id===id).estado=e;S('tc_orders',os);renderOrders()} // permitido a ambos roles
function delPedido(id){if(!isAdmin()||!confirm('¿Eliminar pedido '+id+'?'))return;S('tc_orders',orders().filter(o=>o.id!==id));const f=fin();delete f[id];S('tc_fin',f);renderOrders()}

/* ================= COTIZACIONES (solo Admin) ================= */
function vCotiz(){
  $('#view').innerHTML=`<h2>Cotizaciones PDF</h2><div class="card">
  <div class="grid"><div><label>Cliente</label><input id="qc"></div><div><label>RUC / DNI</label><input id="qd"></div><div><label>Fecha</label><input id="qf" type="date" value="${today()}"></div><div><label>Validez (días)</label><input id="qv" type="number" value="15"></div></div>
  <div class="scroll"><table style="margin-top:12px"><thead><tr><th>Descripción del servicio</th><th style="width:80px">Cant.</th><th style="width:110px">P. unit. (S/)</th><th style="width:100px">Subtotal</th><th></th></tr></thead><tbody id="qi"></tbody></table></div>
  <button class="sec sm" style="margin:8px 0" onclick="addItem()">+ Agregar ítem</button>
  <div class="grid"><div><label><input type="checkbox" id="qig" style="width:auto" onchange="qcalc()"> Incluir IGV (18%)</label></div><div><label>Observaciones / condiciones</label><textarea id="qo" rows="2">Adelanto del 50% para iniciar la producción.</textarea></div></div>
  <p><b id="qt">Total: S/ 0.00</b></p>
  <button onclick="genPDF()">Generar Cotización PDF</button></div>
  <div id="qwrap" class="scroll"><div id="qpdf" class="hidden"></div></div>`;
  addItem();
}
function addItem(){const r=document.createElement('tr');r.innerHTML=`<td><input placeholder="Ej. Confección de 50 polos"></td><td><input type="number" min="0" value="1" oninput="qcalc()"></td><td><input type="number" min="0" step="0.01" oninput="qcalc()"></td><td class="st">S/ 0.00</td><td><button class="dng sm" onclick="this.closest('tr').remove();qcalc()">${ic('x')}</button></td>`;$('#qi').appendChild(r)}
function qrows(){return[...document.querySelectorAll('#qi tr')].map(r=>{const i=r.querySelectorAll('input');return{d:i[0].value,q:+i[1].value||0,p:+i[2].value||0}}).filter(x=>x.d.trim())}
function qtot(){const sub=[...document.querySelectorAll('#qi tr')].reduce((a,r)=>{const i=r.querySelectorAll('input'),s=(+i[1].value||0)*(+i[2].value||0);r.querySelector('.st').textContent=money(s);return a+s},0);const ig=$('#qig').checked?sub*.18:0;return{sub,ig,tot:sub+ig}}
function qcalc(){$('#qt').textContent='Total: '+money(qtot().tot)}

/* ================= INCIDENCIAS ================= */
function vIncid(){
  const A=isAdmin(),all=inc().slice().reverse(),list=A?all:all.filter(i=>i.por===me.u);
  $('#view').innerHTML=`<h2>${A?'Bandeja de incidencias':'Reportes e incidencias'}</h2>
  <div class="card"><h3>${ic('edit')}Nuevo reporte</h3><div class="grid"><div><label>Tipo</label><select id="it"><option>Falla de máquina</option><option>Falta de avíos / hilos</option><option>Problema de calidad</option><option>Reporte diario</option><option>Otro</option></select></div></div>
  <label style="margin-top:10px">Descripción</label><textarea id="id" rows="3"></textarea><button style="margin-top:10px" onclick="sendInc()">Enviar reporte</button></div>
  <div class="card"><div class="scroll"><table><thead><tr><th>Fecha</th><th>Operador</th><th>Tipo</th><th>Descripción</th><th>Estado</th>${A?'<th>Respuesta</th>':''}</tr></thead><tbody>${list.map(i=>`<tr><td>${i.fecha}</td><td>${esc(i.por)}</td><td>${esc(i.tipo)}</td><td>${esc(i.desc)}</td>
  <td>${A?`<select onchange="updInc(${i.id},'estado',this.value)">${['Pendiente','En revisión','Resuelta'].map(e=>`<option ${e===i.estado?'selected':''}>${e}</option>`).join('')}</select>`:`<span class="pill ${i.estado==='Resuelta'?'g':i.estado==='Pendiente'?'a':'n'}">${i.estado}</span>`}</td>
  ${A?`<td><input value="${esc(i.nota)}" placeholder="Nota" onchange="updInc(${i.id},'nota',this.value)"></td>`:''}</tr>`).join('')||'<tr><td colspan="6">Sin reportes.</td></tr>'}</tbody></table></div></div>`;
}
function sendInc(){const d=$('#id').value.trim();if(!d)return toast('Escribe la descripción');const a=inc();a.push({id:Date.now(),fecha:new Date().toLocaleString('es-PE'),por:me.u,tipo:$('#it').value,desc:d,estado:'Pendiente',nota:''});S('tc_inc',a);toast('Reporte enviado');vIncid()}
function updInc(id,k,v){if(!isAdmin())return;const a=inc();a.find(i=>i.id===id)[k]=v;S('tc_inc',a);toast('Actualizado')}

/* ================= USUARIOS (solo Admin) ================= */
function vUsers(){
  $('#view').innerHTML=`<h2>Gestión de usuarios</h2><div class="card"><h3>Nueva cuenta</h3><div class="grid">
  <div><label>Usuario</label><input id="nu"></div><div><label>Contraseña (mín. 6)</label><input id="np" type="password"></div>
  <div><label>Rol</label><select id="nr"><option>Operador</option></select></div></div><button style="margin-top:10px" onclick="addUser()">Crear cuenta</button></div>
  <div class="card"><table><thead><tr><th>Usuario</th><th>Rol</th><th></th></tr></thead><tbody>${users().map(u=>`<tr><td>${esc(u.u)}</td><td>${u.rol}</td><td>${u.fijo?'<small>Predeterminado</small>':`<button class="dng sm" onclick="delUser('${esc(u.u)}')">Eliminar</button>`}</td></tr>`).join('')}</tbody></table></div>`;
}
async function addUser(){
  const u=$('#nu').value.trim(),p=$('#np').value;
  if(!/^[\w.-]{3,}$/.test(u))return toast('Usuario inválido (mín. 3, sin espacios)');
  if(p.length<6)return toast('Contraseña muy corta');
  const a=users();if(a.some(x=>x.u===u))return toast('El usuario ya existe');
  a.push({u,p:await hash(p),rol:'Operador'});S('tc_users',a);toast('Cuenta creada');vUsers();
}
function delUser(u){if(!isAdmin()||!confirm('¿Eliminar '+u+'?'))return;S('tc_users',users().filter(x=>x.u!==u||x.fijo));vUsers()}

/* ================= AJUSTES Y SOPORTE ================= */
function vAjustes(){
  const c=cfg(),A=isAdmin();
  $('#view').innerHTML=`<h2>Ajustes y soporte</h2>
  <div class="card"><h3>${ic('key')}Cambiar mi contraseña</h3><div class="grid"><div><label>Nueva contraseña</label><input id="cp" type="password"></div></div><button style="margin-top:10px" onclick="chPass()">Actualizar</button></div>
  <div class="card"><h3>${ic('sun')}Apariencia</h3><button class="sec" onclick="theme('light')">Claro</button> <button class="sec" onclick="theme('dark')">Oscuro</button></div>
  ${A?`<div class="card"><h3>${ic('bld')}Datos para cotizaciones</h3><div class="grid"><div><label>Dirección</label><input id="cd" value="${esc(c.dir)}"></div><div><label>Teléfono</label><input id="ct" value="${esc(c.tel)}"></div><div><label>Correo</label><input id="cm" value="${esc(c.mail)}"></div></div><button style="margin-top:10px" onclick="saveCfg()">Guardar</button></div>
  <div class="card"><h3>${ic('dl')}Respaldo de datos</h3><p style="color:var(--mu);font-size:13px">Los datos viven en este navegador. Exporta un respaldo con frecuencia.</p><button onclick="exportBk()">Exportar respaldo</button> <label class="btn sec" style="display:inline-block;border:1.5px solid var(--o);background:none;color:var(--tx);cursor:pointer">Importar<input type="file" accept=".json" class="hidden" onchange="importBk(this.files[0])"></label></div>`:''}
  <div class="card"><h3>${ic('help')}Soporte</h3><p>¿Necesitas ayuda con el sistema?</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/51928378474?text=Hola%2C%20necesito%20soporte%20con%20el%20sistema%20de%20gesti%C3%B3n">Escribir por WhatsApp (+51 928378474)</a></div>`;
}
async function chPass(){const p=$('#cp').value;if(p.length<6)return toast('Mínimo 6 caracteres');const a=users();a.find(x=>x.u===me.u).p=await hash(p);S('tc_users',a);$('#cp').value='';toast('Contraseña actualizada')}
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('tc_theme',t)}catch{}}
function saveCfg(){S('tc_cfg',{dir:$('#cd').value,tel:$('#ct').value,mail:$('#cm').value});toast('Guardado')}
function exportBk(){if(!isAdmin())return;const d={users:users(),orders:orders(),fin:fin(),inc:inc(),cfg:cfg()},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='respaldo_tatiana_'+today()+'.json';a.click()}
function importBk(f){if(!isAdmin()||!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users?.length)throw 0;S('tc_users',d.users);S('tc_orders',d.orders||[]);S('tc_fin',d.fin||{});S('tc_inc',d.inc||[]);S('tc_cfg',d.cfg||{});toast('Respaldo restaurado');logout()}catch{toast('Archivo inválido')}};r.readAsText(f)}

try{const t=localStorage.getItem('tc_theme');if(t)document.documentElement.dataset.theme=t}catch{}
boot();
</script>
